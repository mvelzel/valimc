# One trial server: IPv6 Minecraft, shared IPv4/IPv6 HTTPS diagnostics.

app = 'valimc'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '60s'

[build]
[env]
  VALIMC_BIND = '::'
  VALIMC_PORT = '25565'
  VALIMC_ONLINE_MODE = 'true'
  VALIMC_ENCRYPTION = 'true'
  VALIMC_CONSOLE = 'false'
  VALIMC_WORLD = '/data/world'
  VALIMC_GENERATOR = 'vanilla'
  VALIMC_GAME_MODE = 'survival'
  VALIMC_VIEW_DISTANCE = '4'
  VALIMC_SIMULATION_DISTANCE = '4'
  VALIMC_WORLDGEN_PROTO_CELLS = '128'
  VALIMC_PROFILER_BIND = '0.0.0.0'
  VALIMC_PROFILER_PORT = '8080'
  VALIMC_PROFILER_URL = 'https://valimc.fly.dev'
  VALIMC_PROFILER_PATH = '/data/profiles'

[mounts]
  source = 'valimc_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 64
    soft_limit = 48

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[services]]
  protocol = 'tcp'
  internal_port = 25565
  auto_stop_machines = 'off'
  auto_start_machines = true
  processes = ['app']

  [[services.ports]]
    port = 25565
    handlers = []

  [[services.tcp_checks]]
    grace_period = '30s'
    interval = '30s'
    timeout = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
