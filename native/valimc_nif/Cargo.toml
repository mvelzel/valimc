[package]
name = "valimc_nif"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rustler NIF shim exposing valimc_core to the ValiMC server."

[lib]
crate-type = ["cdylib"]

[features]
# Oracle and benchmark NIFs (src/parity.rs): on in dev, test and bench builds,
# off in releases (`config/config.exs`).
parity = []

[dependencies]
valimc_core = { path = "../valimc_core" }
rustler = "0.38"
libc = "0.2"
