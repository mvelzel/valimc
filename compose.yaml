name: valimc

services:
  server:
    image: valimc:${VALIMC_IMAGE_TAG:-local}
    build:
      context: .
      args:
        CARGO_BUILD_JOBS: "1"
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 3g
    ports:
      - "25565:25565/tcp"
      - "127.0.0.1:8080:8080/tcp"
    environment:
      RELEASE_NODE: valimc@127.0.0.1
      VALIMC_BIND: "0.0.0.0"
      VALIMC_PORT: "25565"
      VALIMC_ONLINE_MODE: "true"
      VALIMC_ENCRYPTION: "true"
      VALIMC_CONSOLE: "false"
      VALIMC_WORLD: /data/world
      VALIMC_GENERATOR: vanilla
      VALIMC_GAME_MODE: survival
      VALIMC_VIEW_DISTANCE: "4"
      VALIMC_SIMULATION_DISTANCE: "4"
      VALIMC_WORLDGEN_PROTO_CELLS: "128"
      VALIMC_PROFILER_BIND: "0.0.0.0"
      VALIMC_PROFILER_PORT: "8080"
      VALIMC_PROFILER_URL: ${VALIMC_PROFILER_URL:-http://localhost:8080}
      VALIMC_PROFILER_PATH: /data/profiles
    volumes:
      - valimc_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  valimc_data:
    name: valimc_data
